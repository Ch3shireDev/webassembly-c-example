name: Build & Deploy (C -> WASM) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM
        run: |
          mkdir -p dist
          emcc add.c \
            -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_add"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o dist/main.js

      - name: Prepare site
        run: |
          # GitHub Pages domyślnie szuka index.html
          cp add.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
